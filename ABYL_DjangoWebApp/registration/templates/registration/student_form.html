<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if student %}Edit Student{% else %}Register Student{% endif %}</title>
</head>
<body>
    <h1>{% if student %}Edit Student{% else %}Register Student{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>

    <br>
    <a href="{% url 'student_list' %}">Back to Student List</a>
</body>
</html>
